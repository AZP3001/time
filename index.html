<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Time</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: #f6f7f9; color: #222; }
  section { background: #fff; border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px #0002; }
  h1 { font-size: 1.6rem; } h2 { margin-top: 0; font-size: 1.15rem; }
  input, select, button { font: inherit; padding: 6px 10px; margin: 4px 4px 4px 0; }
  .out { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all; }
  small { color: #666; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; margin-bottom: 8px; }
  .grid label { display: flex; flex-direction: column; font-size: .9rem; }
  .grid input { width: 100%; margin: 2px 0 0; }
  #dates div { padding: 4px 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<h1>Peter Time</h1>
<p><small>1 Peter = 20,464 days</small></p>

<section>
  <h2>Converter</h2>
  <div class="grid">
    <label>Years <input data-s="31556952" type="number" step="any" inputmode="decimal"></label>
    <label>Months <input data-s="2629746" type="number" step="any" inputmode="decimal"></label>
    <label>Weeks <input data-s="604800" type="number" step="any" inputmode="decimal"></label>
    <label>Days <input data-s="86400" type="number" step="any" inputmode="decimal"></label>
    <label>Hours <input data-s="3600" type="number" step="any" inputmode="decimal"></label>
    <label>Minutes <input data-s="60" type="number" step="any" inputmode="decimal"></label>
    <label>Seconds <input data-s="1" type="number" step="any" inputmode="decimal"></label>
  </div>
  <div class="out" id="conv"></div>
</section>

<section>
  <h2>Time until</h2>
  <div id="dates"></div>
</section>

<section>
  <h2>Stopwatch</h2>
  <div class="out" id="sw">0 Peters</div>
  <button id="swStart">Start</button><button id="swReset">Reset</button>
</section>

<section>
  <h2>Timer</h2>
  <input id="tIn" type="number" min="0" step="any" value="0.0000001" aria-label="Peters"> Peters
  <div class="out" id="tOut">0 Peters left</div>
  <button id="tStart">Start</button><button id="tStop">Stop</button>
</section>

<script>
const PETER_MS = 20464 * 86400 * 1000;
const fmt = ms => (ms / PETER_MS).toFixed(12) + ' Peters';
const $ = id => document.getElementById(id);

const fields = [...document.querySelectorAll('.grid input')];
const convert = () => { $('conv').textContent = fmt(fields.reduce((t, f) => t + (+f.value || 0) * f.dataset.s, 0) * 1000); };
fields.forEach((f, i) => {
  f.oninput = convert;
  f.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); (fields[i + 1] || f).focus(); if (!fields[i + 1]) f.blur(); } };
});
// Stop the mouse wheel from changing number inputs instead of scrolling the page
document.querySelectorAll('input[type=number]').forEach(f => f.addEventListener('wheel', () => f.blur(), { passive: true }));
convert();

// Countdowns to yearly dates (month is 0-based)
const DATES = [['New Year', 0, 1], ['Halloween', 9, 31], ['Christmas', 11, 25], ['Birthday (1 September)', 8, 1], ['Birthday (11 September)', 8, 11]];
const nextDate = (m, d) => { const n = new Date(), t = new Date(n.getFullYear(), m, d); if (t <= n) t.setFullYear(t.getFullYear() + 1); return t; };
const showDates = () => {
  $('dates').innerHTML = DATES.map(([name, m, d]) => [name, nextDate(m, d) - Date.now()])
    .sort((a, b) => a[1] - b[1]).map(([name, ms]) => `<div><b>${name}:</b> ${fmt(ms)}</div>`).join('');
};

// Stopwatch
let swStart = null, swAcc = 0;
const swNow = () => swAcc + (swStart ? Date.now() - swStart : 0);
$('swStart').onclick = () => {
  if (swStart) { swAcc = swNow(); swStart = null; $('swStart').textContent = 'Start'; }
  else { swStart = Date.now(); $('swStart').textContent = 'Pause'; }
};
$('swReset').onclick = () => { swAcc = 0; if (swStart) swStart = Date.now(); };

// Timer (silent)
let tEnd = null;
$('tStart').onclick = () => { tEnd = Date.now() + $('tIn').value * PETER_MS; };
$('tStop').onclick = () => { tEnd = null; };

setInterval(() => {
  $('sw').textContent = fmt(swNow());
  showDates();
  if (tEnd) {
    const left = tEnd - Date.now();
    $('tOut').textContent = left > 0 ? fmt(left) + ' left' : "Time's up!";
    if (left <= 0) tEnd = null;
  }
}, 50);
</script>
</body>
</html>
