<!doctype html>
<html lang="en">
<head>
<script>
// ===== Settings: edit these =====
const PETER = 'Hitlers';              // name of the time unit, shown everywhere
const PETER_DAYS = 20464;            // how many days one unit is
const DIFF_START = '1939-09-01';     // default start date for the date difference (YYYY-MM-DD)
const DATES = [                      // countdowns: [name, month 1-12, day]
  ['New Year', 1, 1],
  ['Halloween', 10, 31],
  ['Christmas', 12, 25],
  ['WW2 / 1 September', 9, 1],
  ['9/11', 9, 11],
];
const PEOPLE = [                     // menu people: [name, born, died (null = still alive)]
  ['Vladimir Putin', '1952-10-07', null],
  ['Donald Trump', '1946-06-14', null],
  ['Joseph Stalin', '1878-12-18', '1953-03-05'],
  ['Charlie Kirk', '1993-10-14', '2025-09-10'],
  ['JFK', '1917-05-29', '1963-11-22'],
];
// ================================
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UTC to Hitler Converter</title>
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #222; --muted: #666; --line: #ccd; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme=light]) { --bg: #121417; --card: #1e2126; --text: #e8e8e8; --muted: #9aa; --line: #3a3f47; color-scheme: dark; } }
  :root[data-theme=dark] { --bg: #121417; --card: #1e2126; --text: #e8e8e8; --muted: #9aa; --line: #3a3f47; color-scheme: dark; }
  body { position: relative; font-family: system-ui, sans-serif; max-width: 560px; margin: 0 auto; padding: 16px; background: var(--bg); color: var(--text); }
  section { background: var(--card); border-radius: 10px; padding: 16px; margin-bottom: 16px; box-shadow: 0 1px 3px #0002; }
  h1 { font-size: 1.6rem; } h2 { margin-top: 0; font-size: 1.15rem; }
  input, select, button { font: inherit; padding: 6px 10px; margin: 4px 4px 4px 0; }
  .out { font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; word-break: break-all; }
  small { color: var(--muted); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
  @media (min-width: 480px) { .grid { grid-template-columns: repeat(7, 1fr); } }
  .grid label { display: flex; flex-direction: column; align-items: center; font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .grid input { width: 100%; margin: 3px 0 0; padding: 8px 4px; text-align: center; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--text); -moz-appearance: textfield; }
  .grid input::-webkit-inner-spin-button, .grid input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
  .grid input:focus { outline: 2px solid #4a7dff; border-color: transparent; }
  .grid[hidden] { display: none; }
  #menu { position: absolute; top: 16px; right: 16px; z-index: 1; }
  #menu > summary { list-style: none; cursor: pointer; font-size: 1.6rem; line-height: 1; padding: 4px 8px; border-radius: 8px; }
  #menu > summary::-webkit-details-marker { display: none; }
  #menu .panel { position: absolute; right: 0; width: min(320px, calc(100vw - 32px)); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; box-shadow: 0 4px 16px #0004; }
  #menu h3 { font-size: .8rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 8px 0 4px; }
  #menu input { width: 100%; }
  #pResults button { display: block; width: 100%; text-align: left; }
  #dates div { padding: 4px 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<details id="menu">
  <summary aria-label="Menu">☰</summary>
  <div class="panel">
    <h3>Theme</h3>
    <button data-set-theme="light">Light</button><button data-set-theme="dark">Dark</button>
    <h3>People</h3>
    <div id="people"></div>
    <h3>Search a person (experimental)</h3>
    <input id="pSearch" type="search" placeholder="Search Wikipedia" aria-label="Search a person">
    <div id="pResults"></div>
  </div>
</details>
<h1><span class="u"></span></h1>
<p><small>1 <span class="u"></span> = <span id="days"></span> days</small></p>
<div class="out" id="now"></div>

<section>
  <h2>Converter</h2>
  <button id="swap">⇄ Switch direction</button>
  <div id="rev" hidden>
    <input id="revIn" type="number" step="any" inputmode="decimal" placeholder="0" aria-label="Amount"> <span class="u"></span>
  </div>
  <div class="grid">
    <label>Years <input data-s="31556952" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Months <input data-s="2629746" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Weeks <input data-s="604800" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Days <input data-s="86400" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Hours <input data-s="3600" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Minutes <input data-s="60" type="number" step="any" inputmode="decimal" placeholder="0"></label>
    <label>Seconds <input data-s="1" type="number" step="any" inputmode="decimal" placeholder="0"></label>
  </div>
  <div class="out" id="conv"></div>
</section>

<section>
  <h2>Date difference</h2>
  <label>From <input id="d1" type="date"></label>
  <label>To <input id="d2" type="date"></label>
  <div class="out" id="diff"></div>
</section>

<section>
  <h2>Time until</h2>
  <div id="dates"></div>
</section>

<section>
  <h2>Stopwatch</h2>
  <div class="out" id="sw"></div>
  <button id="swStart">Start</button><button id="swReset">Reset</button>
</section>

<section>
  <h2>Timer</h2>
  <input id="tIn" type="number" min="0" step="any" value="0.0000001" aria-label="Amount"> <span class="u"></span>
  <div class="out" id="tOut"></div>
  <button id="tStart">Start</button><button id="tStop">Stop</button><button id="tReset">Reset</button>
</section>

<script>
// The active unit; changed from the People menu
let UNIT = PETER, UNIT_MS = PETER_DAYS * 864e5;
const fmt = (ms, d = 12) => (ms / UNIT_MS).toFixed(d) + ' ' + UNIT;
const $ = id => document.getElementById(id);
const load = k => { try { return localStorage[k]; } catch {} };
const store = (k, v) => { try { localStorage[k] = v; } catch {} };

// Current date counted from 1 January of year 1
const YEAR1 = new Date(0, 0, 1); YEAR1.setFullYear(1);
const showNow = () => { $('now').textContent = fmt(Date.now() - YEAR1, 6).replace(/ .*/, '') + ` ${UNIT[0].toUpperCase()}AC (${UNIT} After Christ)`; };

// Date difference (both dates read as local midnight)
const today = new Date(), pad = n => String(n).padStart(2, '0');
$('d1').value = DIFF_START;
$('d2').value = `${today.getFullYear()}-${pad(today.getMonth() + 1)}-${pad(today.getDate())}`;
const showDiff = () => {
  const ms = new Date($('d2').value + 'T00:00') - new Date($('d1').value + 'T00:00');
  $('diff').textContent = isNaN(ms) ? 'Pick two dates' : fmt(ms);
};
$('d1').oninput = $('d2').oninput = showDiff;

const fields = [...document.querySelectorAll('.grid input')];
const convert = () => { $('conv').textContent = fmt(fields.reduce((t, f) => t + (+f.value || 0) * f.dataset.s, 0) * 1000); };
fields.forEach((f, i) => {
  f.oninput = convert;
  f.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); (fields[i + 1] || f).focus(); if (!fields[i + 1]) f.blur(); } };
});
// Stop the mouse wheel from changing number inputs instead of scrolling the page
document.querySelectorAll('input[type=number]').forEach(f => f.addEventListener('wheel', () => f.blur(), { passive: true }));

// Reverse: units -> normal time
const showRev = () => {
  let sec = Math.abs(+$('revIn').value || 0) * UNIT_MS / 1000;
  $('conv').textContent = [['years', 31556952], ['days', 86400], ['hours', 3600], ['minutes', 60], ['seconds', 1]]
    .map(([n, len]) => { const v = n === 'seconds' ? +sec.toFixed(2) : Math.floor(sec / len); sec -= v * len; return v + ' ' + n; }).join(', ');
};
$('revIn').oninput = showRev;
$('swap').onclick = () => {
  const rev = $('rev').hidden = !$('rev').hidden;
  document.querySelector('.grid').hidden = !rev;
  rev ? convert() : showRev();
};

// Countdowns to yearly dates
const nextDate = (m, d) => { const n = new Date(), t = new Date(n.getFullYear(), m - 1, d); if (t <= n) t.setFullYear(t.getFullYear() + 1); return t; };
const showDates = () => {
  $('dates').innerHTML = DATES.map(([name, m, d]) => [name, nextDate(m, d) - Date.now()])
    .sort((a, b) => a[1] - b[1]).map(([name, ms]) => `<div><b>${name}:</b> ${fmt(ms)}</div>`).join('');
};

// Stopwatch
let swStart = null, swAcc = 0;
const swNow = () => swAcc + (swStart ? Date.now() - swStart : 0);
$('swStart').onclick = () => {
  if (swStart) { swAcc = swNow(); swStart = null; $('swStart').textContent = 'Start'; }
  else { swStart = Date.now(); $('swStart').textContent = 'Pause'; }
};
$('swReset').onclick = () => { swAcc = 0; if (swStart) swStart = Date.now(); };

// Timer (silent)
let tEnd = null;
$('tStart').onclick = () => { tEnd = Date.now() + $('tIn').value * UNIT_MS; };
$('tStop').onclick = () => { tEnd = null; };
$('tReset').onclick = () => { tEnd = null; $('tOut').textContent = ''; };

// Theme
const setTheme = t => { document.documentElement.dataset.theme = t; store('theme', t); };
document.querySelectorAll('[data-set-theme]').forEach(b => b.onclick = () => setTheme(b.dataset.setTheme));
if (load('theme')) document.documentElement.dataset.theme = load('theme');

// People: the unit becomes that person's lifespan (until today if still alive)
const setUnit = (name, ms) => {
  UNIT = name; UNIT_MS = ms;
  document.title = name + ' Time';
  document.querySelectorAll('.u').forEach(e => e.textContent = name);
  $('days').textContent = Math.round(ms / 864e5).toLocaleString();
  $('rev').hidden ? convert() : showRev();
  showDiff();
};
// p = [name, born, died] or [PETER] for the default unit; dates are ISO strings
const pick = p => {
  setUnit(p[1] ? p[0].replace(/\s*\(.*\)/, '').split(' ').pop() + 's' : p[0],
          p[1] ? (p[2] ? new Date(p[2]) : Date.now()) - new Date(p[1]) : PETER_DAYS * 864e5);
  store('person', JSON.stringify(p));
  $('menu').open = false;
};
const personButton = (label, p, parent) => {
  const b = document.createElement('button');
  b.textContent = label;
  b.onclick = () => pick(p);
  parent.append(b);
  return b;
};
personButton(PETER + ' (default)', [PETER], $('people'));
PEOPLE.forEach(p => personButton(p[0], p, $('people')));
let saved; try { saved = JSON.parse(load('person')); } catch {}
pick(saved || [PETER]);

// Wikipedia search, then Wikidata keeps only humans (P31 = Q5) with a birth date (P569) and gets death (P570)
const API = 'https://en.wikipedia.org/w/api.php?format=json&origin=*&action=query';
// shortcut: ignores Julian vs Gregorian calendar, fine for a few days' error on old dates
const wdDate = t => {
  const m = t && t.match(/^([+-]?\d+)-(\d\d)-(\d\d)/);
  if (!m) return null;
  const d = new Date(Date.UTC(2000, Math.max(+m[2], 1) - 1, Math.max(+m[3], 1)));
  d.setUTCFullYear(+m[1]);
  return d.toISOString();
};
const lifeDates = async ids => {
  const q = `SELECT ?item ?born ?died WHERE { VALUES ?item { ${ids.map(id => 'wd:' + id).join(' ')} }
    ?item wdt:P31 wd:Q5; wdt:P569 ?born. OPTIONAL { ?item wdt:P570 ?died } }`;
  const r = await (await fetch('https://query.wikidata.org/sparql?format=json&query=' + encodeURIComponent(q))).json();
  const out = {};
  for (const row of r.results.bindings) {
    const id = row.item.value.split('/').pop();
    // "unknown value" dates come back as non-literals; first row per person wins
    if (!out[id] && row.born.type === 'literal') out[id] = [wdDate(row.born.value), row.died?.type === 'literal' ? wdDate(row.died.value) : null];
  }
  return out;
};
let searchTimer;
$('pSearch').oninput = () => {
  clearTimeout(searchTimer);
  const q = $('pSearch').value.trim();
  if (!q) return $('pResults').replaceChildren();
  searchTimer = setTimeout(async () => {
    try {
      const r = await (await fetch(`${API}&generator=search&gsrlimit=20&prop=pageprops|description&ppprop=wikibase_item&gsrsearch=${encodeURIComponent(q)}`)).json();
      const pages = Object.values(r.query?.pages || {}).filter(pg => pg.pageprops?.wikibase_item).sort((a, b) => a.index - b.index);
      const dates = pages.length ? await lifeDates(pages.map(pg => pg.pageprops.wikibase_item)) : {};
      if (q !== $('pSearch').value.trim()) return;
      $('pResults').replaceChildren();
      pages.filter(pg => dates[pg.pageprops.wikibase_item]).slice(0, 6).forEach(pg => {
        const b = personButton(pg.title + (pg.description ? ' – ' + pg.description : ''), [pg.title, ...dates[pg.pageprops.wikibase_item]], $('pResults'));
        b.addEventListener('click', () => { $('pSearch').value = ''; $('pResults').replaceChildren(); });
      });
      if (!$('pResults').children.length) $('pResults').textContent = 'No people found';
    } catch { $('pResults').textContent = 'Search failed'; }
  }, 300);
};

setInterval(() => {
  $('sw').textContent = fmt(swNow());
  showDates();
  showNow();
  if (tEnd) {
    const left = tEnd - Date.now();
    $('tOut').textContent = left > 0 ? fmt(left) + ' left' : "Time's up!";
    if (left <= 0) tEnd = null;
  }
}, 50);
</script>
</body>
</html>
